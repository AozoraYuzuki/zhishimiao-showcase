<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">模拟支付通知与超时关单竞争</title><desc id="desc">统一先锁订单，再锁支付记录；通知受理不等于订单一定已支付。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#83674f"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#261b15}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#695546}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#695546}.line{fill:none;stroke:#83674f;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#dac8b8;stroke-width:1.5}.group{fill:#fff4e7;stroke:#d6a575;stroke-width:1.5}</style>
<rect width="1200" height="660" rx="18" fill="#fffaf5"/><text x="40" y="46" class="title">模拟支付通知与超时关单竞争</text><text x="40" y="80" class="sub">统一先锁订单，再锁支付记录；通知受理不等于订单一定已支付。</text>
<g><rect x="40" y="110" width="320" height="120" rx="12" class="box"/><text x="60" y="145" class="heading">定位支付单并预验签</text><text x="60" y="179" class="body">MySQL保存金额／有效期／状态</text><text x="60" y="208" class="body">未知支付单／非法签名→拒绝</text></g><g><rect x="440" y="110" width="320" height="120" rx="12" class="box"/><text x="460" y="145" class="heading">获取订单行锁</text><text x="460" y="179" class="body">支付与关单在同一订单上串行</text><text x="460" y="208" class="body">不同订单不共用本地全局锁</text></g><g><rect x="840" y="110" width="320" height="120" rx="12" class="box"/><text x="860" y="145" class="heading">锁支付记录并复验</text><text x="860" y="179" class="body">合法重复通知→幂等受理</text><text x="860" y="208" class="body">读取锁内当前状态</text></g><path class="line" d="M360 170H440"/><path class="line" d="M760 170H840"/><path class="line" d="M1000 230V280H305V325"/><text class="note" x="350" y="274">未处理通知：校验订单状态、金额与期限</text><path class="line" d="M1000 280H895V325"/><g><rect x="40" y="325" width="530" height="130" rx="12" class="group"/><text x="60" y="360" class="heading">待支付且金额／期限有效</text><text x="60" y="394" class="body">订单PAID + 支付记录SUCCEEDED同事务</text><text x="60" y="423" class="body">任一数据库写入失败→整体回滚</text></g><g><rect x="630" y="325" width="530" height="130" rx="12" class="group"/><text x="650" y="360" class="heading">订单已关闭／过期／金额异常</text><text x="650" y="394" class="body">保存REVIEW_REQUIRED及原因</text><text x="650" y="423" class="body">不重新打开订单，不自动退款</text></g><g><rect x="40" y="515" width="530" height="100" rx="12" class="box"/><text x="60" y="550" class="heading">超时关单</text><text x="60" y="584" class="body">带待支付状态条件UPDATE，取得同一订单行锁</text></g><g><rect x="630" y="515" width="530" height="100" rx="12" class="box"/><text x="650" y="550" class="heading">持久化后返回“通知已受理”</text><text x="650" y="584" class="body">前端再查询本人订单，不把受理直接当支付成功</text></g><path class="line" d="M305 455V490H895V515"/><path class="line" d="M895 455V515"/><text class="note" x="40" y="645">边界：这是模拟支付协议；真实供应商验签、到账事实、资金对账与自动退款尚未接入。</text>
</svg>
