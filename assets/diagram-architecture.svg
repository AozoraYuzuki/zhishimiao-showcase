<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">系统架构与责任边界</title><desc id="desc">单体应用；MySQL负责业务事实，Redis负责协调，RabbitMQ负责订单事件传递。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#83674f"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#261b15}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#695546}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#695546}.line{fill:none;stroke:#83674f;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#dac8b8;stroke-width:1.5}.group{fill:#fff4e7;stroke:#d6a575;stroke-width:1.5}</style>
<rect width="1200" height="660" rx="18" fill="#fffaf5"/><text x="40" y="46" class="title">系统架构与责任边界</text><text x="40" y="80" class="sub">单体应用；MySQL负责业务事实，Redis负责协调，RabbitMQ负责订单事件传递。</text>
<g><rect x="40" y="110" width="320" height="95" rx="12" class="box"/><text x="60" y="145" class="heading">Vue 3 用户端／管理端</text><text x="60" y="179" class="body">HTTP接口 · POST SSE</text></g><g><rect x="440" y="110" width="320" height="95" rx="12" class="box"/><text x="460" y="145" class="heading">认证与接入</text><text x="460" y="179" class="body">Spring Security · 归属校验</text></g><g><rect x="840" y="110" width="320" height="95" rx="12" class="box"/><text x="860" y="145" class="heading">应用服务</text><text x="860" y="179" class="body">确定性交易 · 受控AI编排</text></g><path class="line" d="M360 155H440"/><path class="line" d="M760 155H840"/><g><rect x="40" y="255" width="530" height="170" rx="12" class="group"/><text x="60" y="290" class="heading">订单交易</text><text x="60" y="324" class="body">订单／库存／优惠券／Outbox同事务</text><text x="60" y="353" class="body">独立PaymentService：订单锁→支付记录锁</text><text x="60" y="382" class="body">Outbox发布器：短事务领取后发送MQ</text></g><g><rect x="630" y="255" width="530" height="170" rx="12" class="group"/><text x="650" y="290" class="heading">Spring AI 客服</text><text x="650" y="324" class="body">ChatClient + Advisor + 只读 @Tool</text><text x="650" y="353" class="body">会话／历史／生成记录与上下文版本</text><text x="650" y="382" class="body">知识发布／来源快照 · 独立人工消息</text></g><path class="line" d="M1000 205V232H305V255"/><path class="line" d="M1000 232H895V255"/><g><rect x="40" y="500" width="330" height="110" rx="12" class="box"/><text x="60" y="535" class="heading">MySQL</text><text x="60" y="569" class="body">业务事实／Outbox</text><text x="60" y="598" class="body">会话／运行／知识／工单</text></g><g><rect x="435" y="500" width="330" height="110" rx="12" class="box"/><text x="455" y="535" class="heading">Redis</text><text x="455" y="569" class="body">缓存／限流／生成协调</text><text x="455" y="598" class="body">关单ZSET，数据库扫描兜底</text></g><g><rect x="830" y="500" width="330" height="110" rx="12" class="box"/><text x="850" y="535" class="heading">RabbitMQ</text><text x="850" y="569" class="body">发布确认／重试／死信</text><text x="850" y="598" class="body">订单副作用消费，允许重复</text></g><path class="line" d="M190 425V500"/><path class="line" d="M305 425V465H995V500"/><path class="line" d="M895 425V450H600V500"/><path class="line" d="M760 425V480H260V500"/><text x="40" y="645" class="note">边界：MQ确认不等于消费完成；支付模拟，未接入真实资金处理；Demo不连接以上服务。</text>
</svg>
