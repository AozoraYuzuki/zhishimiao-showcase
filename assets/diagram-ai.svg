<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">客服路由、生成与人工接管</title><desc id="desc">路由决定检索策略，不决定权限；身份只从服务端上下文获取。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#83674f"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#261b15}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#695546}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#695546}.line{fill:none;stroke:#83674f;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#dac8b8;stroke-width:1.5}.group{fill:#fff4e7;stroke:#d6a575;stroke-width:1.5}</style>
<rect width="1200" height="660" rx="18" fill="#fffaf5"/><text x="40" y="46" class="title">客服路由、生成与人工接管</text><text x="40" y="80" class="sub">路由决定检索策略，不决定权限；身份只从服务端上下文获取。</text>
<g><rect x="40" y="110" width="310" height="115" rx="12" class="box"/><text x="60" y="145" class="heading">认证与会话准入</text><text x="60" y="179" class="body">登录身份／归属／运行版本</text><text x="60" y="208" class="body">Redis协调不可用→拒绝新生成</text></g><g><rect x="445" y="110" width="310" height="115" rx="12" class="box"/><text x="465" y="145" class="heading">问题路由</text><text x="465" y="179" class="body">知识／实时／组合／普通</text><text x="465" y="208" class="body">写操作仅解释路径，不执行交易</text></g><g><rect x="850" y="110" width="310" height="115" rx="12" class="box"/><text x="870" y="145" class="heading">Spring AI 标准编排</text><text x="870" y="179" class="body">ChatClient + Advisor + @Tool</text><text x="870" y="208" class="body">3轮／6次预算，超限明确失败</text></g><path class="line" d="M350 170H445"/><path class="line" d="M755 170H850"/><g><rect x="40" y="290" width="310" height="125" rx="12" class="box"/><text x="60" y="325" class="heading">知识检索</text><text x="60" y="359" class="body">发布版本／关键词＋向量／RRF</text><text x="60" y="388" class="body">保存注入片段及来源，不担保事实</text></g><g><rect x="445" y="290" width="310" height="125" rx="12" class="box"/><text x="465" y="325" class="heading">只读业务工具</text><text x="465" y="359" class="body">ToolContext身份＋SQL归属过滤</text><text x="465" y="388" class="body">有界线程池，等待≤2秒／LIMIT 5</text></g><g><rect x="850" y="290" width="310" height="125" rx="12" class="box"/><text x="870" y="325" class="heading">单订阅POST SSE</text><text x="870" y="359" class="body">start→delta→done／error</text><text x="870" y="388" class="body">RUNNING→成功／失败／取消</text></g><path class="line" d="M600 225V255H195V290"/><path class="line" d="M600 255V290"/><path class="line" d="M1005 225V290"/><text class="note" x="365" y="275">组合可同时使用两类证据</text><path class="line" d="M755 352H800V200H850"/><path class="line" d="M195 415V440H1180V200H1160"/><text class="note" x="350" y="435">知识证据与工具结果回到编排，不直接作为最终回答</text><g><rect x="40" y="500" width="530" height="110" rx="12" class="group"/><text x="60" y="535" class="heading">最终回答与状态落库</text><text x="60" y="569" class="body">成功时回答与来源同事务保存</text><text x="60" y="598" class="body">校验上下文版本，旧生成不能覆盖新状态</text></g><g><rect x="630" y="500" width="530" height="110" rx="12" class="group"/><text x="650" y="535" class="heading">取消／人工接管</text><text x="650" y="569" class="body">终止生成并恰好释放许可；中断为尽力而为</text><text x="650" y="598" class="body">人工暂停机器人，关闭后保留历史／新上下文</text></g><path class="line" d="M1005 415V460H305V500"/><path class="line" d="M1005 460H895V500"/><text class="note" x="40" y="645">工具失败不能拿历史价格／库存补答；人工消息单独保存。模型替身验收不代表真实模型效果。</text>
</svg>
