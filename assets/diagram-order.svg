<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">下单事务与订单事件</title><desc id="desc">订单提交不等待RabbitMQ；失败可重试，消费副作用必须幂等。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#83674f"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#261b15}.title{font-size:27px;font-weight:700}.sub{font-size:17px;fill:#695546}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#695546}.line{fill:none;stroke:#83674f;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#dac8b8;stroke-width:1.5}.group{fill:#fff4e7;stroke:#d6a575;stroke-width:1.5}</style>
<rect width="1200" height="660" rx="18" fill="#fffaf5"/><text x="40" y="46" class="title">下单事务与订单事件</text><text x="40" y="80" class="sub">订单提交不等待RabbitMQ；失败可重试，消费副作用必须幂等。</text>
<rect class="group" x="40" y="105" width="1120" height="155" rx="14"/><text class="heading" x="60" y="140">同一个MySQL事务：任何写入失败都回滚</text><g><rect x="60" y="158" width="300" height="82" rx="12" class="box"/><text x="80" y="193" class="heading">订单／库存／优惠券</text><text x="80" y="227" class="body">校验、条件扣减与落库</text></g><g><rect x="450" y="158" width="300" height="82" rx="12" class="box"/><text x="470" y="193" class="heading">Outbox事件</text><text x="470" y="227" class="body">固定eventId／原关单截止时间</text></g><g><rect x="840" y="158" width="300" height="82" rx="12" class="box"/><text x="860" y="193" class="heading">提交事务</text><text x="860" y="227" class="body">返回下单结果，不直接访问MQ</text></g><path class="line" d="M360 200H450"/><path class="line" d="M750 200H840"/><path class="line" d="M990 260V295H210V330"/><text class="note" x="455" y="288">提交后后台领取</text><g><rect x="60" y="330" width="300" height="125" rx="12" class="box"/><text x="80" y="365" class="heading">短事务领取</text><text x="80" y="399" class="body">SKIP LOCKED · 租约／token</text><text x="80" y="428" class="body">提交领取后再等待消息确认</text></g><g><rect x="450" y="330" width="300" height="125" rx="12" class="box"/><text x="470" y="365" class="heading">发布到RabbitMQ</text><text x="470" y="399" class="body">ACK且未退回→SENT</text><text x="470" y="428" class="body">失败／超时→退避重试</text></g><g><rect x="840" y="330" width="300" height="125" rx="12" class="box"/><text x="860" y="365" class="heading">幂等消费</text><text x="860" y="399" class="body">清缓存／固定截止时间关单</text><text x="860" y="428" class="body">完成记录落库后确认消息</text></g><path class="line" d="M360 390H450"/><path class="line" d="M750 390H840"/><g><rect x="60" y="505" width="300" height="110" rx="12" class="box"/><text x="80" y="540" class="heading">数据库回写失败</text><text x="80" y="574" class="body">租约过期可重投</text><text x="80" y="603" class="body">旧领取者不能覆盖新执行者</text></g><g><rect x="450" y="505" width="300" height="110" rx="12" class="box"/><text x="470" y="540" class="heading">确认边界</text><text x="470" y="574" class="body">SENT仅表示broker接收且路由</text><text x="470" y="603" class="body">不是消费者处理成功</text></g><g><rect x="840" y="505" width="300" height="110" rx="12" class="box"/><text x="860" y="540" class="heading">至少一次</text><text x="860" y="574" class="body">重复DEL／关单入队保持幂等</text><text x="860" y="603" class="body">重试耗尽留存DEAD／DLQ</text></g><text class="note" x="60" y="645">MQ关闭时Outbox仍落库；缓存清理可能积压，超时关单由数据库扫描兜底。</text>
</svg>
