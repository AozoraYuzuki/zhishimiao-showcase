<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src &#39;self&#39;; script-src &#39;self&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; data: blob:; font-src &#39;self&#39; data:; connect-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;self&#39;; form-action &#39;self&#39;">

    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知食喵</title>

    <!--
      ==========================================================================
      关键内联样式：首绘底色与 body 边距
      --------------------------------------------------------------------------
      ## 为什么首绘底色必须内联、不能放外部 CSS
      入场画布是 Vue 组件，要等 JS 加载并挂载后才存在。实测（dev 环境）
      0~1100ms 是一整屏**纯白** —— 也就是说这个"入场动画"在最该起作用的前
      一秒里根本不存在，用户先看白屏、再看画面浮上来，观感比不做入场更糟。
      在 HTML 里先把底色铺成墨玉，从第一个像素起就是画布色，白屏被彻底消除。

      ⚠️ 外部样式表要多一个往返才能生效，那一往返恰好就是白屏时间。

      ⚠️ 必须硬编码 #1c1917，不能用 var(--action-600)：
         variables.css 此刻还没加载，CSS 变量在这个时点是未定义的，
         写 var() 会得到空值 → 底色失效 → 白屏照旧。
         改色时**必须同步改 variables.css 的 --action-600 与这里的字面量**。

      ## 底色由 data-intro 属性控制（不是靠 JS 清 style）
      最初写成 `html{background:#1c1917}` 再在"不播"分支里
      `html.style.background=''`，结果**根本清不掉** —— 内联样式表的 html 规则
      优先级高于"行内空值"，暗底会一直留着，非首页顶着一层墨玉（实测 htmlBg
      始终是 rgb(28,25,23)）。改成属性驱动后 JS 只设属性，让 CSS 自己让路。

        · data-intro="pending" → 入场即将播放，先铺底（消除白屏）
        · data-intro-skip      → 明确不播，连底都不要（消除非首页闪黑）
      ==========================================================================
    -->
    <style>
      html[data-intro='pending'],
      html[data-intro='pending'] body,
      html:not([data-intro='pending']):not([data-intro-skip]),
      html:not([data-intro='pending']):not([data-intro-skip]) body {
        background: #1c1917;
      }

      /*
        body 归零边距（reset 的兜底）。
        ⚠️ 必须内联，不能只靠 main.css 的 reset：入场是**滚动驱动**的，
           用户滚到中途时停留的那个位置也在样式表覆盖范围内 ——
           实测省略这条后，滚动中画面两侧各露出一条白边（body 默认 8px margin）。
      */
      body {
        margin: 0;
      }

      /*
        演示模式工具条在入场期间压掉。
        它的 z-index 是 9999，会浮在画布之上 —— 实测入场早期就在画面上露出
        一排按钮，很穿帮。
      */
      html[data-intro='pending'] .zs-demo-bar,
      html[data-intro-playing] .zs-demo-bar {
        display: none !important;
      }
    </style>

    <!--
      入场引导：判断本次是否播入场 + 开合首绘底色。

      ⚠️ 必须是**外部文件**，绝不能写成内联 <script>。
         构建期会注入 CSP `script-src 'self'`（见 vite.config.ts 的 buildOnlyCsp），
         内联脚本会被直接拒绝执行 —— 实测产物里 window.__DSH_INTRO__ 为 undefined，
         于是 shouldPlayIntro() 返回 false，**线上 Demo 永远不会播入场**；
         而 dev 环境不注入 CSP，本地怎么看都是好的。这个坑就是这么来的。
         放 public/ 由 <script src> 引入即可：public 的文件原样拷到站点根、
         不受打包改名影响，可安全地用 'self' 放行，不必放开 'unsafe-inline'
         削掉这道安全兜底。

      ⚠️ 用相对路径 ./intro-boot.js：Demo 构建的 base 是 './'，
         部署在子目录（GitHub Pages 的 /zhishimiao-showcase/demo/）也能解析。

      ⚠️ 这里是**普通 script，不是 type=module**：它必须在最早时刻同步执行完，
         越简单越稳。
    -->
    <script src="./intro-boot.js"></script>
    <script type="module" crossorigin src="./assets/index-DhQg7gpH.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/runtime-core.esm-bundler-Fp4m3CJW.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CIneF6Ac.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
